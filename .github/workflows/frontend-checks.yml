name: Frontend checks

on:
  pull_request:
    branches: [dev]
  push:
    branches:
      - 'refactor/**'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, ESLint, build and CSS audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: CSS inventory
        run: npm run audit:css
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Report CSS and JavaScript asset sizes
        run: node scripts/report-build-assets.mjs

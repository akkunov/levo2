name: Frontend checks

on:
  pull_request:
    branches: [dev]
  push:
    branches:
      - 'refactor/**'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, ESLint, build and CSS audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: CSS inventory
        run: npm run audit:css
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Development home smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 > /tmp/levo-next-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/levo-home.html 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/levo-next-dev.log
            exit 1
          fi
          grep -q 'hero.webp' /tmp/levo-home.html
          sleep 2
          if grep -E 'TypeError|digest:|unconfigured-qualities' /tmp/levo-next-dev.log; then
            cat /tmp/levo-next-dev.log
            exit 1
          fi
